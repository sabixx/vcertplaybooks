config:
  connection:
    platform: vaas
    credentials:
      apiKey: '{{ Env "TLSPC_APIKEY" }}'
certificateTasks:
  - name: tomcat
    renewBefore: 30d
    setEnvVars: ["thumbprint"]
    request:
      csr: local
      keySize: 3072
      subject:
        commonName: '{{Env "DOMAINS"}}'
        country: GB
        locality: London
        state: London
        organization: Venafi
        orgUnits:
          - vcert
      sanDNS:
        - '{{Env "DOMAINS"}}'
      zone: 'Tomcat\public_le'
    installations:
      - format: JKS
        file: '/etc/ssl/private/tomcat_443.jks'
        jksAlias: tomcat443
        jksPassword: '{{ Env "KEYSTOREPASS" }}'
        afterInstallAction: "systemctl restart tomcat"
        backupFiles: true
