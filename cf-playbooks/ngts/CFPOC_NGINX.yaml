config:
  connection:
    platform: tlspc
    credentials:
      externalJWT: '{{ Env "TLSPC_ExternalJWT" }}'
      tokenURL: '{{ Env "TLSPC_tokenURL" }}'
certificateTasks:
  - name: nginx
    renewBefore: 30d
    setEnvVars: ["thumbprint"]
    request:
      csr: local
      keySize: 3072
      subject:
        commonName: '{{Env "DOMAINS"}}'
        country: GB
        locality: London
        state: London
        organization: Venafi
        orgUnits:
          - vcert
      sanDNS:
        - '{{Env "DOMAINS"}}'
      zone: 'LE - 90 Days'
    installations:
      - format: PEM
        file: "/etc/ssl/certs/nginx_443.crt"
        chainFile: "/etc/ssl/certs/nginx_443.chain.crt"
        keyFile: "/etc/ssl/private/nginx_443.key"
        afterInstallAction: "cat /etc/ssl/certs/nginx_443.chain.crt >> /etc/ssl/certs/nginx_443.crt && systemctl reload nginx"
