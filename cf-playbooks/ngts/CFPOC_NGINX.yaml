config:
  connection:
    platform: NGTS
    url: '{{ Env "NGTS_URL" }}' # NGTS URL as environment variable
    credentials:
      clientId: '{{ Env "NGTS_CLIENT_ID" }}' # NGTS client ID as environment variable
      clientSecret: '{{ Env "NGTS_CLIENT_SECRET" }}' # NGTS client secret as environment variable
      scope: '{{ Env "NGTS_SCOPE" }}' # NGTS scope as environment variable
      tokenURL: '{{ Env "NGTS_TOKEN_URL" }}' # NGTS token URL as environment variable
certificateTasks:
  - name: nginx
    renewBefore: 30d
    setEnvVars: ["thumbprint"]
    request:
      csr: local
      keySize: 3072
      subject:
        commonName: '{{Env "DOMAINS"}}'
        country: GB
        locality: London
        state: London
        organization: Venafi
        orgUnits:
          - vcert
      sanDNS:
        - '{{Env "DOMAINS"}}'
      zone: 'LE - 90 Days'
    installations:
      - format: PEM
        file: "/etc/ssl/certs/nginx_443.crt"
        chainFile: "/etc/ssl/certs/nginx_443.chain.crt"
        keyFile: "/etc/ssl/private/nginx_443.key"
        afterInstallAction: "cat /etc/ssl/certs/nginx_443.chain.crt >> /etc/ssl/certs/nginx_443.crt && systemctl reload nginx"
